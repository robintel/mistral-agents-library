name: autocorrect

# The fact-checker gate: every new addition or change to markdown
# content or the manifest is fact-checked by a big model before merge.
# Configure the repository secrets to enable:
#   MISTRAL_API_KEY  — required, the gate skips gracefully without it
#   AUTOCORRECT_MODEL (repository variable, optional) — defaults to
#     mistral-medium-latest (tier t4, the premium deep-reasoning model)

on:
  pull_request:
    paths:
      - '**.md'
      - 'manifest.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  fact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the fact-checker
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOCORRECT_MODEL: ${{ vars.AUTOCORRECT_MODEL || 'mistral-medium-latest' }}
          BASE_REF: origin/${{ github.base_ref }}
        run: python3 .github/scripts/autocorrect_check.py
