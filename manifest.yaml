  - { name: data-engineer,    path: data_lc/data-engineer.md,  domain: data_lc, tier: t2, escalate: t3, accepts: [data-pipeline] }
  - { name: data-analyst,     path: data_lc/data-analyst.md,   domain: data_lc, tier: t1, escalate: t4, accepts: [analysis] }

routing:  # task_class -> agent
  intake: intake-analyst
  architecture: architect
  implementation: implementer
  development: code-developer
  scaffolding: scaffolder
  tests: test-engineer
  review: code-reviewer
  debugging: debugger
  ops: devops
  release: release-manager
  data-pipeline: data-engineer
  analysis: data-analyst
  catalog: model-registrar
  discovery: app-cartographer
  test-tour: tour-coordinator
  tour-guidebook: tour-guidebook
  tour-supper-model: tour-supper-model
  tour-fedex: tour-fedex
  tour-landlord: tour-landlord
  tour-rained-out: tour-rained-out
  tour-all-nighter: tour-all-nighter
  tour-bad-neighborhood: tour-bad-neighborhood
  tour-back-alley: tour-back-alley
  test-design: test-designer
  test-automation: test-automator
  automation-review: automation-reviewer
  suite-review: suite-reviewer
  flaky-tests: flaky-test-analyst
  unit-tests: unit-test-writer
  coverage: coverage-manager
  upgrade-planning: upgrade-planner
  dependency-upgrade: dependency-upgrader
  migration: migration-engineer
  data-migration: data-migration-engineer
  rollback: rollback-operator

profiles:
  frugal:
    tier_shift: -2        # applied to the agent's default tier, floored at t0
    parallelism: 1
    verbosity: V1
    context: summary      # send summaries, not full files
    max_iterations: 1
  balanced:
    tier_shift: 0
    parallelism: 2
    verbosity: V2
    context: curated      # send exactly what the brief needs
    max_iterations: 2
  fast:
    tier_shift: 1         # capped at t4
    parallelism: 4
    verbosity: V2
    context: full
    max_iterations: 3

testing:
  coverage_floor: 80       # percent line coverage the coverage-manager enforces; the brief overrides

verbosity:
  V0: artifacts only; at most one line of prose
  V1: bullet points, no restating the brief; at most 120 words
  V2: findings, rationale, next steps; at most 400 words
  V3: full reasoning, alternatives considered, trade-offs; unbounded
