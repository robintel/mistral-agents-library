  - { name: general-zero-trust-dialect, path: agent-dialects/general-zero-trust-dialect.md, domain: dialects, description: "Zero Trust Architecture terminology, principles, and implementation patterns across all domains (IT, government, business, finance, healthcare, critical infrastructure)" }
  - { name: blockchain-dialect, path: agent-dialects/blockchain-dialect.md, domain: dialects, description: "Blockchain terminology and implementation patterns across all domains, integrating with OT/ICS security dialects" }
  - { name: general-blockchain-dialect, path: agent-dialects/general-blockchain-dialect.md, domain: dialects, description: "Blockchain and Distributed Ledger Technology terminology, principles, and implementation patterns across all domains" }

profiles:
  frugal:
    tier_shift: -2        # applied to the agent's default tier, floored at t0
    parallelism: 1
    verbosity: V1
    context: summary      # send summaries, not full files
    max_iterations: 1
  balanced:
    tier_shift: 0
    parallelism: 2
    verbosity: V2
    context: curated      # send exactly what the brief needs
    max_iterations: 2
  fast:
    tier_shift: 1         # capped at t4
    parallelism: 4
    verbosity: V2
    context: full
    max_iterations: 3

testing:
  coverage_floor: 80       # percent line coverage the coverage-manager enforces; the brief overrides

verbosity:
  V0: artifacts only; at most one line of prose
  V1: bullet points, no restating the brief; at most 120 words
  V2: findings, rationale, next steps; at most 400 words
  V3: full reasoning, alternatives considered, trade-offs; unbounded
