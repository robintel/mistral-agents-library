# Machine-readable registry for the Mistral Agents Library.
# Single source of truth for routing, profiles, and verbosity.
# Tier membership: selectors are policy; `resolved` is data, refreshed by the
# model-registrar agent and applied only with the user's approval.

version: 1

models:
  freshness:                  # routing trusts this; the model-registrar refreshes it
    checked: 2026-10-04
    staleness: 90 days        # beyond this, the orchestrator proposes a refresh
  sources:                    # model-registrar preference order
    - https://api.mistral.ai/v1/models   # authoritative for the account; needs MISTRAL_API_KEY and an HTTP tool
    - https://docs.mistral.ai/models     # public lineup and deprecations, via web search
    - https://mistral.ai/pricing/api/    # prices, which the API does not expose, via web search

  tiers:  # selectors are policy: how a discovered family joins a tier; first match wins
    t0:
      select: [ "ministral-3b*", "ministral-8b*" ]
      require: [completion_chat]
      cost_band: lowest
      good_at: [classification, extraction, formatting]
    t1:
      select: [ "ministral-14b*", "mistral-small*" ]
      require: [completion_chat]
      cost_band: low
      good_at: [docs, scaffolds, orchestration, light-agentic]
    t2:
      select: [ "codestral*" ]
      require: [completion_chat]
      cost_band: medium
      good_at: [implementation, tests, pipelines, fill-in-the-middle]
    t3:
      select: [ "mistral-large*" ]
      require: [completion_chat]
      cost_band: high
      good_at: [review, synthesis, complex-coding]
    t4:
      select: [ "mistral-medium*" ]
      require: [completion_chat]
      cost_band: premium
      good_at: [architecture, deep-reasoning, agentic-coding, cross-cutting-design]
    # Deliberately unclaimed: zai-glm*, voxtral*, ocr, embed, moderation,
    # leanstral. Add a selector only when a family fills a tier gap.

  resolved:  # data, not policy: current members, $/1M tokens (in/out); -latest aliases
    t0: [ministral-3b-latest, ministral-8b-latest]     # 0.10/0.10, 0.15/0.15
    t1: [ministral-14b-latest, mistral-small-latest]   # 0.20/0.20, 0.15/0.60
    t2: [codestral-latest]                             # 0.30/0.90
    t3: [mistral-large-latest]                         # 0.50/1.50
    t4: [mistral-medium-latest]                        # 1.50/7.50

agents:
  - { name: orchestrator,     path: orchestrator.md,           domain: core,    tier: t1, escalate: t4, accepts: [triage, synthesis] }
  - { name: model-registrar,  path: model-registrar.md,        domain: core,    tier: t1, escalate: t3, accepts: [catalog] }
  - { name: intake-analyst,   path: sdlc/app-dev/intake-analyst.md,     domain: sdlc,    tier: t1, escalate: t2, accepts: [intake] }
  - { name: architect,        path: sdlc/app-dev/architect.md,         domain: sdlc,    tier: t4, escalate: t4, accepts: [architecture] }
  - { name: implementer,      path: sdlc/app-dev/implementer.md,       domain: sdlc,    tier: t2, escalate: t3, accepts: [implementation] }
  - { name: code-developer,   path: sdlc/app-dev/code-developer.md,   domain: sdlc,    tier: t3, escalate: t4, accepts: [development] }
  - { name: scaffolder,       path: sdlc/app-dev/scaffolder.md,       domain: sdlc,    tier: t2, escalate: t3, accepts: [scaffolding] }
  - { name: test-engineer,    path: sdlc/testing/test-engineer.md,     domain: sdlc,    tier: t2, escalate: t3, accepts: [tests] }
  - { name: code-reviewer,    path: sdlc/app-dev/code-reviewer.md,     domain: sdlc,    tier: t3, escalate: t4, accepts: [review] }
  - { name: debugger,         path: sdlc/app-dev/debugger.md,          domain: sdlc,    tier: t3, escalate: t4, accepts: [debugging] }
  - { name: devops,           path: sdlc/app-dev/devops.md,            domain: sdlc,    tier: t2, escalate: t3, accepts: [ops] }
  - { name: release-manager,  path: sdlc/app-dev/release-manager.md,   domain: sdlc,    tier: t1, escalate: t2, accepts: [release] }
  - { name: app-cartographer, path: sdlc/testing/app-cartographer.md,  domain: sdlc,    tier: t2, escalate: t3, accepts: [discovery] }
  - { name: tour-coordinator, path: sdlc/testing/tour-coordinator.md,  domain: sdlc,    tier: t2, escalate: t3, accepts: [test-tour] }
  - { name: tour-guidebook,   path: sdlc/testing/tour-guidebook.md,    domain: sdlc,    tier: t2, escalate: t3, accepts: [tour-guidebook] }
  - { name: tour-supper-model, path: sdlc/testing/tour-supper-model.md, domain: sdlc,  tier: t2, escalate: t3, accepts: [tour-supper-model] }
